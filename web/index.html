  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      background: #06080C;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background:
        radial-gradient(circle at 50% 42%, rgba(61, 220, 132, 0.10), transparent 45%),
        linear-gradient(rgba(28, 36, 48, 0.55) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(90deg, rgba(28, 36, 48, 0.55) 1px, transparent 1px) 0 0 / 48px 48px,
        #06080C;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      transition: opacity 0.45s ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .mark {
      width: 112px;
      height: 112px;
      filter: drop-shadow(0 0 24px rgba(61, 220, 132, 0.25));
    }

    .mark .frame {
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      animation: draw 0.9s ease-out forwards;
    }

    .mark .glyph {
      fill-opacity: 0;
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      animation: draw 0.9s 0.25s ease-out forwards, fill 0.4s 0.85s ease-out forwards;
    }

    .mark .cursor {
      opacity: 0;
      animation: blink 1s 1.1s steps(1) infinite;
    }

    .boot {
      color: #8B96A5;
      font-size: 13px;
      letter-spacing: 0.02em;
      min-height: 18px;
    }

    .boot b {
      color: #3DDC84;
      font-weight: 400;
    }

    .bar {
      width: 180px;
      height: 2px;
      background: #1C2430;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3DDC84, #38BDF8);
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { fill-opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark .frame, .mark .glyph { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
      .mark .cursor { animation: none; opacity: 1; }
      .bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
<div id="splash" aria-label="Loading">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <rect class="frame" x="1" y="1" width="62" height="62" rx="15" fill="#0C1016"
          stroke="#3DDC84" stroke-opacity=".55" stroke-width="1.5"/>
    <path class="glyph" d="M13.77 42L13.77 18L21.5 18Q23.9 18 25.69 18.77Q27.48 19.55 28.48 20.93Q29.48 22.31 29.48 24.18Q29.48 26.22 28.37 27.58Q27.25 28.95 25.47 29.21L25.47 29.28Q26.82 29.41 27.86 30.21Q28.89 31.02 29.47 32.27Q30.04 33.52 30.04 35.06Q30.04 37.13 29.01 38.7Q27.97 40.26 26.12 41.13Q24.26 42 21.79 42ZM18.54 27.67L21.43 27.67Q22.88 27.67 23.7 26.89Q24.52 26.12 24.52 24.81Q24.52 23.46 23.7 22.72Q22.88 21.98 21.43 21.98L18.54 21.98ZM18.54 38.02L21.63 38.02Q23.24 38.02 24.16 37.17Q25.08 36.31 25.08 34.8Q25.08 33.29 24.16 32.42Q23.24 31.55 21.63 31.55L18.54 31.55ZM32.15 42L38.03 18L44.28 18L50.23 42L45.2 42L44.05 36.58L38.33 36.58L37.18 42ZM39.15 32.63L43.19 32.63L42.04 26.84Q41.81 25.59 41.57 24.36Q41.32 23.13 41.19 22.44Q41.06 23.13 40.84 24.35Q40.63 25.56 40.37 26.81Z" fill="#3DDC84" stroke="#3DDC84" stroke-width="0.6"/>
    <rect class="cursor" x="13.77" y="47" width="10" height="3.2" rx="1" fill="#38BDF8"/>
  </svg>
  <div class="boot"><b>$</b> <span id="boot-line">booting portfolio</span></div>
  <div class="bar"><i></i></div>
</div>

<script>
  // Cycle a few boot lines while the engine downloads.
  (function () {
    var lines = ['booting portfolio', 'binding device services', 'loading gemma-2b',
                 'mounting ui'];
    var el = document.getElementById('boot-line');
    var i = 0;
    window.__bootTimer = setInterval(function () {
      i = (i + 1) % lines.length;
      el.textContent = lines[i];
    }, 700);
  })();

  function hideSplash() {
    var splash = document.getElementById('splash');
    if (!splash || splash.classList.contains('hide')) return;
    clearInterval(window.__bootTimer);
    splash.classList.add('hide');
    setTimeout(function () { splash.remove(); }, 500);
  }

  window.addEventListener('flutter-first-frame', hideSplash);
  // Safety net in case the first-frame event never fires.
  setTimeout(hideSplash, 15000);
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
